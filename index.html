<title>金融工作台 · iPhone Workbench</title>
<style>
:root{
  --bg:#0a0e17; --surface:#131722; --surface-2:#1a1f2e; --border:#232a3a;
  --text:#e1e6f0; --dim:#8b93a7; --faint:#5a6273;
  --up:#f23645; --down:#00b67a; --accent:#38bdf8; --warn:#f59e0b; --gold:#eab308;
  --fear:#ef4444; --greed:#22c55e; --neutral:#eab308;
  --radius:18px; --pad:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* iPhone frame (desktop) */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#16203a,#05070d 60%);padding:20px}
.device{position:relative;width:390px;max-width:100vw;height:min(844px,calc(100vh - 40px));max-height:100vh;background:var(--bg);border-radius:54px;overflow:hidden;
  box-shadow:0 0 0 12px #0b0b0d,0 0 0 13px #2a2a2e,0 40px 90px rgba(0,0,0,.7);display:flex;flex-direction:column}
@media(max-width:520px){.stage{padding:0;background:var(--bg)}.device{width:100vw;height:100vh;max-height:100vh;border-radius:0;box-shadow:none}}


/* app shell */
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
@media(max-width:520px){.app{padding-top:var(--safe-t)}}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(80px + var(--safe-b))}
.view[hidden]{display:none}

/* header */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 0 14px}
.hdr .title{font-size:22px;font-weight:800;letter-spacing:.2px}
.hdr .sub{font-size:12px;color:var(--dim);margin-top:3px}
.hdr .actions{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--warn);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);padding:4px 9px;border-radius:20px}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.iconbtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.iconbtn:active{background:var(--surface-2)}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card .ch .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text)}
.card .ch .tag{font-size:10px;color:var(--faint);border:1px solid var(--border);padding:1px 6px;border-radius:6px}
.card .ch .more{font-size:11px;color:var(--dim)}
.card .delta{font-size:11px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}

/* fear & greed gauge */
.fg{display:flex;align-items:center;gap:14px}
.fg .gauge{flex-shrink:0}
.fg .info{flex:1;min-width:0}
.fg .val{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.fg .lab{font-size:14px;font-weight:700;margin-top:4px}
.fg .prev{font-size:11px;color:var(--dim);margin-top:6px}
.fg .prev.jqk{cursor:pointer;user-select:none;border-top:1px dashed var(--border);padding-top:5px;margin-top:7px}
.fg .prev.jqk:hover{color:var(--text)}
.jqkedit{opacity:.5;font-size:10px;margin-left:3px}
.fg .comps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fg .comp{font-size:10px;color:var(--dim);background:var(--surface-2);padding:3px 7px;border-radius:8px}
.fg .comp b{color:var(--text)}
/* 韭圈儿 6 大成分指标网格 */
.jqk-comps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.jqk-comp{background:var(--surface-2);border-radius:10px;padding:10px 8px;text-align:center}
.jqk-comp .c-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jqk-comp .c-val{font-size:19px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.jqk-comp .c-val small{font-size:11px;font-weight:600;color:var(--dim);margin-left:2px}
.jqk-comp .c-status{font-size:11px;margin-top:3px;font-weight:600}
@media (max-width:560px){.jqk-comps{grid-template-columns:repeat(2,1fr)}}


/* indices row */
.idx-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:0 -2px}
.idx{flex:0 0 auto;min-width:108px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px}
.idx .nm{font-size:11px;color:var(--dim)}
.idx .mk{font-size:9px;color:var(--faint);margin-left:4px}
.idx .p{font-size:17px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.idx .c{font-size:11px;font-weight:700;margin-top:1px}

/* flow bars */
.flow{display:flex;flex-direction:column;gap:10px}
.flow .row{display:flex;align-items:center;gap:10px}
.flow .lbl{width:74px;font-size:12px;color:var(--dim);flex-shrink:0}
.utag{font-size:10px;font-style:normal;color:var(--faint);margin-left:5px;opacity:.75}
.flow .bar{flex:1;height:18px;border-radius:9px;background:var(--surface-2);overflow:hidden;position:relative}
.flow .fill{position:absolute;left:50%;top:0;height:100%;border-radius:9px;transform-origin:left center}
.flow .amt{width:88px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.flow.total{margin-top:4px;padding-top:10px;border-top:1px dashed var(--border)}

/* breadth stacked */
.br-stack{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:4px}
.br-stack .seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.br-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--dim)}
.br-legend b{font-weight:800}

/* valuation */
.val-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}
.val-row:last-child{border-bottom:none}
.val-row .nm{width:80px;font-size:12px;flex-shrink:0}
.val-row .track{flex:1;height:8px;border-radius:5px;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);position:relative}
.val-row .pin{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:#fff}
.val-row .pe{width:54px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.val-row .pct{width:54px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* sectors heatmap */
.heat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.heat .cell{border-radius:10px;padding:9px 8px;border:1px solid var(--border)}
.heat .cell .n{font-size:11px}
.heat .cell .c{font-size:14px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
/* 美股隔夜行业卡：每行列 5 个、格子略小 */
.heat.tight{gap:5px}
.heat.tight .cell{padding:7px 5px;border-radius:8px}
.heat.tight .cell .n{font-size:10px}
.heat.tight .cell .c{font-size:12px;margin-top:1px}
/* sector cell with PE percentile */
.sec-cell{padding:8px 7px}
.sec-cell .sct{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.sec-cell .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec-cell .sc{font-size:11px;font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums}
.sec-cell .strk{position:relative;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--down),var(--neutral),var(--up));margin-top:7px}
.sec-cell .spin{position:absolute;top:-2px;width:2px;height:8px;background:#fff;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.sec-cell .pct{font-size:10px;font-weight:700;margin-top:5px;color:var(--dim)}
.sec-cell .pct.low{color:var(--down)}
.sec-cell .pct.high{color:var(--up)}
.sec-sort{display:inline-flex;gap:4px}
.sec-sort button{font-size:10px;padding:3px 8px;border-radius:10px;border:1px solid var(--border);color:var(--dim)}
.sec-sort button.on{color:var(--accent);border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}

/* 2-col grid of mini gauge cards */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid-2 .card{margin-bottom:0;min-width:0}
.mini-g{padding:12px 12px;display:flex;flex-direction:column}
.mini-g .mg-top{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.mini-g .mn{font-size:12px;color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-g .ms{font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini-g .ms small{font-size:10px;font-weight:700;margin-left:2px}
.mini-g .mg-viz{width:100%;margin-top:11px}
.mini-g .mg-cap{width:100%;font-size:10px;color:var(--faint);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* centered +/- bar */
.m-center{position:relative;height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.m-center-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border);z-index:2}
.m-center-fill{position:absolute;top:2px;bottom:2px;border-radius:5px}
/* two-segment split bar */
.m-split{display:flex;height:16px;border-radius:5px;overflow:hidden}
.m-split .seg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
/* gradient track + pin (PE-percentile style) */
.m-track{position:relative;height:8px;border-radius:5px}
.m-track.sent{background:linear-gradient(90deg,var(--fear),var(--neutral),var(--greed))}
.m-pin{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.m-scales{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:4px}
/* futures long/short positioning */
.fut-row{padding:7px 0;border-bottom:1px solid var(--border)}
.fut-row:last-of-type{border-bottom:none}
.fr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fr-nm{font-size:12px;color:var(--text)}
.fr-nm b{color:var(--accent);font-weight:800;margin-right:4px}
.fr-net{font-size:11px;font-weight:700}
.fr-bar{display:flex;align-items:center;gap:8px}
.fr-val{width:36px;font-size:11px;font-weight:700;text-align:center;flex-shrink:0}
.fr-track{flex:1;position:relative;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fr-track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border);z-index:2}
.fr-fill{position:absolute;top:2px;bottom:2px;border-radius:5px}
.fut-legend{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:10px;color:var(--faint)}
.fut-legend .lg{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.lg.g{background:var(--down)}
.lg.r{background:var(--up)}

/* 三数字并排（涨停/跌停/强势股） */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st3{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 8px;text-align:center}
.st3 .k{font-size:10px;color:var(--dim)}
.st3 .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.st3 .u{font-size:9px;color:var(--faint);margin-top:2px}

/* 通用表格行（期指行情 / 行业估值 / 细分板块） */
.tbl{display:flex;flex-direction:column}
.tbl .th{display:flex;font-size:10px;color:var(--faint);padding:0 0 6px;border-bottom:1px solid var(--border)}
.tbl .tr{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.tbl .tr:last-child{border-bottom:none}
.tbl .c-nm{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .c-lead{display:block;font-size:9px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .c-num{width:58px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}
.tbl .c-num.b{font-weight:800}
.tbl .c-tag{width:52px;text-align:right;font-size:10px;color:var(--faint);flex-shrink:0}

/* tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:74px;background:rgba(13,17,24,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding:8px 0 calc(var(--safe-b) + 8px);z-index:40}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--faint);padding-top:6px}
.tabbar button .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.tabbar button.on{color:var(--accent)}

/* settings */
.set-group{margin-bottom:16px}
.set-group .gh{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:4px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.set-group .gh .qa{font-size:10px;color:var(--accent);font-weight:600}
.set-list{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.set-item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--border)}
.set-item:last-child{border-bottom:none}
.set-item .l{display:flex;flex-direction:column;gap:2px}
.set-item .l .n{font-size:14px;font-weight:600}
.set-item .l .d{font-size:11px;color:var(--faint)}
.sw{position:relative;width:46px;height:28px;border-radius:15px;background:var(--surface-2);border:1px solid var(--border);transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#6b7280;transition:.22s cubic-bezier(.4,0,.2,1)}
.sw.on{background:rgba(0,182,122,.18);border-color:rgba(0,182,122,.4)}
.sw.on::after{transform:translateX(18px);background:var(--down)}
.set-foot{text-align:center;font-size:11px;color:var(--faint);margin-top:8px}
.note{font-size:11px;color:var(--faint);line-height:1.6;margin-top:4px}
</style>
</head>

/* ---------- LIVE data layer: browser fetches public APIs directly ----------
 * 数据源（全部支持 CORS，无需后端）：
 *  - 东方财富 push2:      指数行情 / 全A涨跌家数 / 换手率 / 股指期货 / 细分板块
 *  - 东方财富 push2ex:    涨停 / 跌停 / 炸板 家数
 *  - 东方财富 datacenter: 融资融券余额 / 行业估值 PE-PB（无 CORS，走 JSONP）
 *  - 腾讯 qt.gtimg:       申万一级行业当日涨跌（GBK 编码）
 *  - 兜底: localStorage 缓存的上次成功数据，再兜底才是上方静态快照
 */
const LIVE={ts:null,sources:{},busy:false,cacheTs:null,ttl:{}};  // ttl[k] = 该源上次成功拉取的时刻，用于日频节流

/* 兜底缓存：把最近一次成功拉到的实时数据写进 localStorage。
 * 接口全挂时显示「上次成功的数据 + 时间标签」，而不是退回 2026-08-24 的硬编码快照
 * ——那个快照不会随时间更新，页面放得越久越具有误导性。 */
const CKEY='finbench.cache.v2';   // v2：新增期指/涨跌停/换手率/行业估值/细分板块字段
function saveCache(){
  if(!LIVE.ts)return;
  try{
    localStorage.setItem(CKEY,JSON.stringify({
      ts:LIVE.ts.getTime(),
      indices:D.indices,
      breadth:D.breadth,
      margin:D.margin,
      sectorTag:D.sectorTag,
      sectors:D.sectors.map(s=>({code:s.code,chg:s.chg})),
      futuresQuote:D.futuresQuote,
      limitPool:D.limitPool,
      turnover:D.turnover,
      indVal:D.indVal,
      boards:D.boards,
      jqkComps:D.jqkComps,
      mainflow:D.mainflow,
      usSectors:D.usSectors,
      usIndustries:D.usIndustries,
      jqk:D.jqk
    }));
  }catch(e){}
}
function loadCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CKEY)||'null');
    if(!c||!c.ts)return false;
    if(c.indices&&c.indices.length)D.indices=c.indices;
    if(c.breadth)D.breadth=c.breadth;
    if(c.margin)D.margin=c.margin;
    if(c.sectors&&c.sectors.length){
      const map={};c.sectors.forEach(s=>map[s.code]=s.chg);
      D.sectors.forEach(s=>{if(map[s.code]!==undefined)s.chg=map[s.code];});
    }
    if(c.futuresQuote&&c.futuresQuote.list)D.futuresQuote=c.futuresQuote;
    if(c.limitPool&&c.limitPool.date)D.limitPool=c.limitPool;
    if(c.turnover)D.turnover=c.turnover;
    if(c.indVal&&c.indVal.date)D.indVal=c.indVal;
    if(c.boards&&c.boards.list&&c.boards.list.length)D.boards=c.boards;
    if(c.mainflow&&typeof c.mainflow.main==='number')D.mainflow=c.mainflow;
    if(c.usSectors&&c.usSectors.list&&c.usSectors.list.length)D.usSectors=c.usSectors;
    if(c.usIndustries&&Array.isArray(c.usIndustries.industries)&&c.usIndustries.industries.length)D.usIndustries=c.usIndustries;
    if(c.jqk&&typeof c.jqk.value==='number')D.jqk=c.jqk;
    if(c.jqkComps&&Array.isArray(c.jqkComps))D.jqkComps=c.jqkComps;
    D.sectorTag=c.sectorTag||null;
    LIVE.cacheTs=new Date(c.ts);
    return true;
  }catch(e){return false;}
}
/* 韭圈儿恐贪指数 + 6 大成分指标 —— 数据来源链（三级兜底，逐级自动降级）：
 *   1) JQK_WORKER_URL —— Cloudflare Worker 实时拉取（服务端做 fadrefa 签名 + AES 解密，token 只留服务端）
 *   2) JQK_RAW_URL    —— GitHub 仓库里的 jqk.json，由 GitHub Actions 每天 21:00 更新；
 *                        raw.githubusercontent.com 带 ACAO:*，浏览器可直接跨域读取
 *   3) 同目录 jqk.json —— 本地文件兜底（fetch_jqk_signed.js 手动跑写入）
 * 三者都不可用时，用户仍可手动点「韭圈儿恐贪指数」卡片填入主指数。
 * 浏览器侧调度：填了任一远端地址后，每天 21:00 自动拉一次（scheduleJqkDaily），页面长期开着也会跨日刷新。 */
const JQK_WORKER_URL=''; // 例：'https://jqk.xxx.workers.dev/jqk'
const JQK_RAW_URL='https://raw.githubusercontent.com/xuyang203/jqk-fear-greed/main/jqk.json';
// ↑ 对应 GitHub 仓库 xuyang203/jqk-fear-greed；仓库名若改了这里要同步改
const hasJqkRemote=()=>!!JQK_WORKER_URL||(!!JQK_RAW_URL&&JQK_RAW_URL.indexOf('YOUR_USERNAME')<0);
function applyJqk(o){
  if(!o)return false;
  // 新结构 {main:{value,status,date}, components:[...]}
  if(o.main&&typeof o.main.value==='number'&&o.main.value>=0&&o.main.value<=100){
    D.jqk={value:o.main.value, date:(o.main.date||(o.updatedAt?o.updatedAt.slice(0,10):todayMD())), status:o.main.status||null};
    if(Array.isArray(o.components))D.jqkComps=o.components;
    return true;
  }
  // 旧结构（兼容） {value,status,date}
  if(typeof o.value==='number'&&o.value>=0&&o.value<=100){
    D.jqk={value:o.value, date:(o.date||(o.updatedAt?o.updatedAt.slice(0,10):todayMD())), status:o.status||null};
    return true;
  }
  return false;
}
async function loadJqk(){
  if(JQK_WORKER_URL){
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(JQK_WORKER_URL,{cache:'no-store',signal:ctl.signal});
      clearTimeout(to);
      if(r.ok&&applyJqk(await r.json())){ if(typeof renderDash==='function')renderDash(); return; }
    }catch(e){/* 降级到下一级 */}
  }
  if(JQK_RAW_URL&&JQK_RAW_URL.indexOf('YOUR_USERNAME')<0){
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
      // raw.githubusercontent.com 有约 5 分钟 CDN 缓存，用时间戳参数破缓存
      const r=await fetch(JQK_RAW_URL+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal});
      clearTimeout(to);
      if(r.ok&&applyJqk(await r.json())){ if(typeof renderDash==='function')renderDash(); return; }
    }catch(e){/* 降级到下一级 */}
  }
  // 兜底：读本地 jqk.json
  try{
    const r=await fetch('jqk.json',{cache:'no-store'});
    if(!r.ok)return;
    if(applyJqk(await r.json())){ if(typeof renderDash==='function')renderDash(); }
  }catch(e){}
}

/* 韭圈儿每日定时刷新：每天 21:00 浏览器侧拉一次（纯前端，不依赖 WorkBuddy）。
 * 需先填 JQK_WORKER_URL 或 JQK_RAW_URL 之一才生效；两者都空则 loadJqk 只退化读本地 jqk.json。
 * 页面开着跨越 21:00 即自动刷新；关页面则靠下次打开 init 的 loadJqk 取最新。 */
function scheduleJqkDaily(){
  if(!hasJqkRemote())return;
  const at=()=>{ const n=new Date(), t=new Date(); t.setHours(21,0,0,0); if(t<=n)t.setDate(t.getDate()+1); return t-n; };
  const fire=()=>{ loadJqk(); setTimeout(fire, 24*3600*1000); };
  setTimeout(fire, at());
}

const US_QQ='https://qt.gtimg.cn/q=';
const US_BATCH=50;
const US_MIN_CONSTITUENTS=3;
const US_CACHE_KEY='finbench_usind_v1';

function applyUsInd(o){
  if(!o||!o.industries||!Array.isArray(o.industries)||!o.industries.length)return false;
  D.usIndustries={date:o.date||'', sectors:o.sectors||[], industries:o.industries, stats:o.stats||{}};
  try{ localStorage.setItem(US_CACHE_KEY, JSON.stringify(D.usIndustries)); }catch(e){}
  return true;
}

/* 美东常规交易时段（北京视图）：用 Intl 取 America/New_York 本地时间，自动处理夏令时；周一至周五 09:30–16:00 */
function usMarketOpen(){
  try{
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',weekday:'short',hour12:false}).formatToParts(new Date());
    const g=t=>{const p=parts.find(x=>x.type===t);return p?p.value:'';};
    const wd=g('weekday'); if(wd==='Sat'||wd==='Sun')return false;
    let h=parseInt(g('hour'),10); if(h===24)h=0;
    const m=parseInt(g('minute'),10);
    const mins=h*60+m;
    return mins>=9*60+30 && mins<=16*60;
  }catch(e){ return true; } // 时区 API 不可用时保守视为开盘（照常刷新）
}

/* 浏览器实时算：腾讯批量拉价 → 等权聚合到 GICS 行业 */
async function computeUsIndustries(){
  const codes=Object.keys(SP500_GICS);
  const rows=[]; const dates={};
  for(let i=0;i<codes.length;i+=US_BATCH){
    const batch=codes.slice(i,i+US_BATCH);
    try{
      const txt=await tget(US_QQ+batch.map(c=>'us'+c).join(','), 12000);
      txt.split(';').forEach(p=>{
        const mm=p.match(/v_(\w+)="([^"]*)"/); if(!mm)return;
        const f=mm[2].split('~');
        const code=mm[1].replace(/^us/,'').toUpperCase();
        const pct=parseFloat(f[32]);
        if(!isNaN(pct)&&SP500_GICS[code]){
          rows.push({code,pct});
          const d=(f[30]||'').slice(0,10); if(d)dates[d]=(dates[d]||0)+1;
        }
      });
    }catch(e){ /* 单批失败跳过，继续其他批 */ }
    await new Promise(r=>setTimeout(r,120));
  }
  if(rows.length<300){ // 抓取异常（腾讯限流/网络），不覆盖已有缓存
    if(typeof renderDash==='function')renderDash();
    return;
  }
  let dataDate='';
  const dk=Object.entries(dates).sort((a,b)=>b[1]-a[1])[0];
  if(dk)dataDate=dk[0];
  const grp={};
  rows.forEach(r=>{ const mp=SP500_GICS[r.code]; const k=mp[1]+'|'+mp[0]; (grp[k]=grp[k]||{sec:mp[1],ind:mp[0],sum:0,n:0}).sum+=r.pct; grp[k].n++; });
  const all=Object.values(grp).map(g=>({sec:g.sec,ind:g.ind,n:g.n,chg:+(g.sum/g.n).toFixed(2)}));
  const thin=all.filter(x=>x.n<US_MIN_CONSTITUENTS);
  const kept=all.filter(x=>x.n>=US_MIN_CONSTITUENTS).sort((a,b)=>US_SEC_ORDER.indexOf(a.sec)-US_SEC_ORDER.indexOf(b.sec)||b.chg-a.chg);
  const secGrp={}; kept.forEach(x=>(secGrp[x.sec]=secGrp[x.sec]||[]).push(x.chg));
  const sectors=Object.entries(secGrp).map(([sec,arr])=>({sec,n:arr.length,chg:+(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2)})).sort((a,b)=>US_SEC_ORDER.indexOf(a.sec)-US_SEC_ORDER.indexOf(b.sec));
  applyUsInd({
    date:dataDate,
    updatedAt:new Date().toISOString(),
    source:'S&P 500 (GICS) + 腾讯行情·前端实时',
    method:'equal-weight',
    universe:'S&P 500',
    minConstituents:US_MIN_CONSTITUENTS,
    stats:{stocks:rows.length, industries:kept.length, droppedThin:thin.length},
    sectors, industries:kept
  });
  if(typeof renderDash==='function')renderDash();
}

/* 美股 GICS 刷新调度：加载即算（先显缓存）→ 交易时段每 6 小时刷新 */
function scheduleUsIndustries(){
  try{ const c=JSON.parse(localStorage.getItem(US_CACHE_KEY)||'null'); if(c&&c.industries&&c.industries.length){ D.usIndustries=c; } }catch(e){}
  if(typeof renderDash==='function')renderDash();
  computeUsIndustries();
  setInterval(()=>{ if(usMarketOpen()) computeUsIndustries(); }, 6*3600*1000);
}


async function jget(url,timeout=9000){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(t);}
}

/* JSONP：datacenter-web.eastmoney.com 不返回 CORS 头，浏览器直接 fetch 会被同源策略拦截，
 * 改用 <script src=...&callback=fn> 注入取数（script 标签不受同源策略限制）。 */
function jsonp(url,timeout=9000){
  return new Promise((resolve,reject)=>{
    const cb='__fb_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const s=document.createElement('script');
    let done=false;
    const t=setTimeout(()=>{if(!done){clean();reject(new Error('jsonp timeout'));}},timeout);
    function clean(){done=true;clearTimeout(t);try{delete window[cb];}catch(e){}if(s.parentNode)s.remove();}
    window[cb]=d=>{clean();resolve(d);};
    s.onerror=()=>{if(!done){clean();reject(new Error('jsonp network error'));}};
    s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
    document.head.appendChild(s);
  });
}

/* 东财 push2 多镜像回退 + 单镜像重试（官方有多个编号镜像，限流独立，抗间歇性丢包） */
const EM_HOSTS=['push2.eastmoney.com','3.push2.eastmoney.com','12.push2.eastmoney.com'];
async function emget(path){
  let err;
  for(const h of EM_HOSTS){
    for(let i=0;i<2;i++){
      try{
        const j=await jget('https://'+h+path);
        if(j&&(j.data!==undefined||j.result!==undefined))return j;
        throw new Error('bad payload');
      }catch(e){err=e;await new Promise(r=>setTimeout(r,1500));}
    }
  }
  throw err;
}

/* 腾讯行情文本接口：GBK 编码，需 arrayBuffer + TextDecoder 解码 */
async function tget(url,timeout=9000){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    try{return new TextDecoder('gbk').decode(buf);}
    catch(e){return new TextDecoder('utf-8',{fatal:false}).decode(buf);}
  }finally{clearTimeout(t);}
}

/* 行业板块：申万一级 31 行业当日涨跌（腾讯板块指数 pt 代码，单次批量请求；PE 分位保持静态快照） */
async function fetchSectors(){
  const codes=D.sectors.filter(s=>s.code).map(s=>'pt'+s.code);
  if(codes.length<31)return false;
  const txt=await tget('https://qt.gtimg.cn/q='+codes.join(','));
  let n=0;
  D.sectors.forEach(s=>{
    const m=txt.match(new RegExp('v_pt'+s.code+'="([^"]*)"'));
    if(!m)return;
    const f=m[1].split('~');
    const cur=parseFloat(f[3]),prev=parseFloat(f[4]);
    if(cur>0&&prev>0){
      s.chg=Math.round((cur-prev)/prev*10000)/100;
      n++;
    }
  });
  if(n>=20){D.sectorTag='申万一级·当日';return true;}
  return false;
}

 * 创业板指(399006)的 f104 是成分股口径，混进来会重复计数，所以只取它的 f8 换手率。 */
async function fetchBreadth(){

  rows.forEach(x=>{

/* 股指期货：中金所市场号是 220（不是常见的 8/113/225，这个坑排查了很久）。
 * 合约代码 = 品种 + 年份后两位 + 月份。枚举未来 6 个月，服务端只返回已挂牌的
 * （实测请求 28 个返回 16 个），再按成交量 f5 挑出主力合约 —— 避免硬编码月份导致换月后失效。 */
const FUT_CODE=[['IF','沪深300'],['IH','上证50'],['IC','中证500'],['IM','中证1000']];
function futSecids(){
  const now=new Date(),out=[];
  for(let i=0;i<6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    const m=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0');
    FUT_CODE.forEach(c=>out.push('220.'+c[0]+m));
  }
  return out;
}
async function fetchFutures(){
  const j=await emget('/api/qt/ulist.np/get?secids='+futSecids().join(',')+'&fields=f2,f3,f5,f6,f12&fltt=2&invt=2');
  const rows=(j.data&&j.data.diff)||[];
  const list=FUT_CODE.map(([code,name])=>{
    const cand=rows.filter(x=>x.f12&&x.f12.indexOf(code)===0&&typeof x.f5==='number'&&x.f5>0&&typeof x.f2==='number'&&x.f2>0);
    if(!cand.length)return null;
    const m=cand.reduce((a,b)=>(b.f5||0)>(a.f5||0)?b:a);   // 成交量最大 = 主力
    return {code,name,contract:m.f12,price:+m.f2.toFixed(1),chg:+(m.f3||0).toFixed(2),vol:m.f5};
  }).filter(Boolean);
  if(list.length<4)return false;
  D.futuresQuote={list};
  return true;
}

/* 全市场主力资金流：东财行业板块(m:90+t:2, 共496个)分页拉全量累加，等价全A口径(近似万得全A)
 * 单页最多100行，故分页 pn=1..5；fields f62主力 f66超大单 f72大单 f78小单(单位元)，/1e8→亿 */
async function fetchMainFlow(){
  try{
    const fields='f12,f14,f62,f66,f72,f78,f184';
    const mk=pn=>`/api/qt/clist/get?pn=${pn}&pz=100&po=1&np=1&fltt=2&invt=2&fid=f62&fs=m%3A90%2Bt%3A2&fields=${fields}`;
    let main=0,xl=0,big=0,sm=0,cnt=0;
    /* 逐页拉取、单页失败跳过其余页：避免 Promise.all 一页失败整次作废，
     * 导致卡片永久卡在上一次成功的旧日期（此前主力资金流不更新到当日的根因） */
    for(const pn of [1,2,3,4,5]){
      try{
        const j=await emget(mk(pn));
        ((j.data&&j.data.diff)||[]).forEach(x=>{main+=(x.f62||0);xl+=(x.f66||0);big+=(x.f72||0);sm+=(x.f78||0);cnt++;});
      }catch(e){/* 该页失败，继续累计其它页 */}
    }
    if(!cnt)return false;  // 仅当 5 页全部失败时判失败
    const d=new Date();const ds=`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    D.mainflow={main:+(main/1e8).toFixed(1),xl:+(xl/1e8).toFixed(1),big:+(big/1e8).toFixed(1),sm:+(sm/1e8).toFixed(1),date:ds};
    return true;
  }catch(e){return false;}
}

/* 总调度：并行拉取，单源失败不影响其他源。
 * force=true 时强制重拉全部（手动刷新按钮）。
 * 分两类：
 *  - 实时源（指数/板块/涨跌家数/期指/涨跌停池/细分板块）：每轮都拉，跟着 60 秒轮询走
 *  - 日频源（两融、行业估值）：一天才变一次，6 小时内只拉一次，别跟着 60 秒反复打
 * 涨跌停池只在交易时段拉 —— 收盘后它恒为 0，没有意义。 */
const DAILY_TTL=6*3600*1000;
const DAILY_SRC={margin:fetchMargin, indVal:fetchIndVal};
const REALTIME_SRC=[['indices',fetchIndices],['sectors',fetchSectors],['breadth',fetchBreadth],
                    ['futures',fetchFutures],['boards',fetchBoards]];
/* 单源硬性超时兜底：即便某源的 fetch 在网络半开/反代环境下迟迟不 resolve、abort 也未触发，
 * 也保证该 job 在 JOB_TIMEOUT 内 settle，绝不让 Promise.all 永久阻塞（否则 spinner 永远转、徽标卡在「连接中」） */
const JOB_TIMEOUT=18000;
function withTimeout(p,ms){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('job timeout')),ms))]);
}
async function loadLive(force){
  if(LIVE.busy)return;
  LIVE.busy=true;
  $('#refresh').classList.add('spin');
  const jobs=REALTIME_SRC.slice();
  if(force||inSession(new Date()))jobs.push(['limitPool',fetchLimitPool]);
  if(force||tradingDay(new Date()))jobs.push(['mainflow',fetchMainFlow]);
  Object.keys(DAILY_SRC).forEach(k=>{
    if(force||!LIVE.ttl[k]||Date.now()-LIVE.ttl[k]>DAILY_TTL)jobs.push([k,DAILY_SRC[k]]);
  });
  try{
    await Promise.all(jobs.map(async([k,fn])=>{
      try{const ok=await withTimeout(fn(),JOB_TIMEOUT);LIVE.sources[k]=ok;if(ok)LIVE.ttl[k]=Date.now();}
      catch(e){LIVE.sources[k]=false;}
    }));
  }catch(e){}
  LIVE.ts=new Date();
  LIVE.busy=false;
  $('#refresh').classList.remove('spin');
  if(Object.values(LIVE.sources).some(Boolean))saveCache();
  updateLiveBadge();
  renderDash();
}

/* gauge geometry */
function ang(v){return(180-v*1.8)*Math.PI/180;}
function arcPath(cx,cy,r,v0,v1){const a0=ang(v0),a1=ang(v1);const x0=cx+r*Math.cos(a0),y0=cy-r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy-r*Math.sin(a1);const lg=Math.abs(v1-v0)*1.8>180?1:0;return`M ${x0} ${y0} A ${r} ${r} 0 ${lg} 1 ${x1} ${y1}`;}
function gaugeSVG(v,cx,cy,r,sw,w,h){
  const Z=[[0,25,'#ef4444'],[25,45,'#f59e0b'],[45,55,'#eab308'],[55,75,'#84cc16'],[75,100,'#22c55e']];
  const arcs=Z.map(z=>`<path d="${arcPath(cx,cy,r,z[0],z[1])}" fill="none" stroke="${z[2]}" stroke-width="${sw}" stroke-linecap="butt" opacity=".88"/>`).join('');
  const na=ang(v);const nx=cx+(r-sw/2-3)*Math.cos(na),ny=cy-(r-sw/2-3)*Math.sin(na);
  const dx=cx+r*Math.cos(na),dy=cy-r*Math.sin(na);
  return `<svg class="gauge" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${arcs}<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#fff" stroke-width="${Math.max(2.4,sw*0.3)}" stroke-linecap="round"/><circle cx="${dx}" cy="${dy}" r="${sw*0.62}" fill="#fff" opacity=".95"/><circle cx="${cx}" cy="${cy}" r="${sw*0.42}" fill="#0a0e17"/><circle cx="${cx}" cy="${cy}" r="${Math.max(1.2,sw*0.42-1.6)}" fill="#fff"/></svg>`;
}

      ${list.map(x=>`
        <div class="tr">
          <span class="c-nm">${x.name}</span>
          <span class="c-num b">${x.pe.toFixed(1)}</span>
          <span class="c-num" style="color:var(--dim)">${x.pb!==null?x.pb.toFixed(2):'—'}</span>
          <span class="c-tag">${x.n||'—'}</span>
        </div>`).join('')}
    </div>
    <div class="fut-legend"><span>${v.list.length} 个细分行业按 PE-TTM 升序取前 ${list.length}</span><span>日频 · 6小时拉取一次</span></div>
  </div>`;
}

function rBoards(){
  const b=D.boards;
  if(!b.list||!b.list.length){
    return `<div class="card">
      ${cardHeader('细分板块涨幅榜','东财细分板块')}
      <div class="note" style="text-align:center;padding:20px 0;color:var(--faint)">板块数据暂不可用</div>
    </div>`;
  }
  return `<div class="card">
    ${cardHeader('细分板块涨幅榜',b.tag||'东财细分板块')}
    <div class="tbl">
      <div class="th"><span class="c-nm">板块</span><span class="c-num">涨跌</span><span class="c-num">换手</span><span class="c-tag">PE</span></div>
      ${b.list.map(x=>`
        <div class="tr">
          <span class="c-nm">${x.name}${x.lead?`<span class="c-lead">领涨 ${x.lead}${x.leadChg!==null?' '+fchg(x.leadChg):''}</span>`:''}</span>
          <span class="c-num b ${upDown(x.chg)}">${fchg(x.chg)}</span>
          <span class="c-num" style="color:var(--dim)">${x.turn!==null?x.turn.toFixed(1)+'%':'—'}</span>
          <span class="c-tag">${x.pe!==null?x.pe:'—'}</span>
        </div>`).join('')}
    </div>
    <div class="fut-legend"><span>共 496 个板块按涨幅取前 ${b.list.length}</span><span>比申万31行业更细 · 盘中实时</span></div>
  </div>`;
}

function rBreadth(){
  const d=D.breadth;const t=d.up+d.down+d.flat;
  const w=v=>t>0?(v/t*100).toFixed(1):'0.0';   // t=0 时直接算会渲染出 NaN%
  return `<div class="card">
    ${cardHeader('涨跌家数比','A股')}
    <div class="br-stack">
      <div class="seg up" style="width:${w(d.up)}%;background:var(--up)">${w(d.up)}%</div>
      <div class="seg" style="width:${w(d.flat)}%;background:var(--surface-2);color:var(--dim)">${w(d.flat)}%</div>
      <div class="seg down" style="width:${w(d.down)}%;background:var(--down)">${w(d.down)}%</div>
    </div>
    <div class="br-legend"><span><b class="up">${fmtNum(d.up)}</b> 上涨</span><span><b style="color:var(--dim)">${fmtNum(d.flat)}</b> 平盘</span><span><b class="down">${fmtNum(d.down)}</b> 下跌</span></div>
    ${D.turnover?`<div class="flow" style="margin-top:11px;padding-top:10px;border-top:1px dashed var(--border)">
      <div class="row"><span class="lbl">换手率</span><span class="amt" style="width:auto;flex:1;text-align:left;color:var(--dim);font-weight:600">沪 ${D.turnover.sh!==null?D.turnover.sh.toFixed(2)+'%':'—'} · 深 ${D.turnover.sz!==null?D.turnover.sz.toFixed(2)+'%':'—'} · 创 ${D.turnover.cyb!==null?D.turnover.cyb.toFixed(2)+'%':'—'}</span></div>
    </div>`:''}
  </div>`;
}

function rValuation(){
  return `<div class="card">
    ${cardHeader('PE 估值分位','近5年百分位')}
    ${D.valuation.map(v=>`
      <div class="val-row">
        <span class="nm">${v.name}</span>
        <div class="track"><div class="pin" style="left:calc(${v.pct}% - 2px)"></div></div>
        <span class="pe">PE ${v.pe}</span>
        <span class="pct ${v.pct<40?'down':v.pct>60?'up':''}">${v.pct}%</span>
      </div>`).join('')}
  </div>`;
}

let sectorSort='chg';
function rSectors(){
  const hasPctAny=D.sectors.some(s=>s.pct!==null&&s.pct!==undefined);
  const sortFn=(sectorSort==='pct'&&hasPctAny)
    ?(a,b)=>(b.pct||0)-(a.pct||0)
    :(a,b)=>(b.chg||0)-(a.chg||0);
  const total=D.sectors.length;
  const list=[...D.sectors].sort(sortFn).slice(0,total>40?30:total);
  const tag=D.sectorTag||(hasPctAny?'申万一级·快照':'申万一级 31 个');
  const sortBtns=hasPctAny?`<span class="sec-sort"><button data-sort="chg" class="${sectorSort==='chg'?'on':''}">按涨跌</button><button data-sort="pct" class="${sectorSort==='pct'?'on':''}">按分位</button></span>`:'';
  return `<div class="card">
    ${cardHeader('板块热度',`${tag}${total>40?'·TOP30':''}`,sortBtns)}
    <div class="heat">${list.map(s=>{
      const c=s.chg||0;
      const hasPct=s.pct!==null&&s.pct!==undefined;
      const pc=hasPct&&s.pct<40?'low':hasPct&&s.pct>60?'high':'';
      return `<div class="cell sec-cell" style="background:${heatColor(c)}">
        <div class="sct"><span class="nm">${s.name}</span><span class="sc ${upDown(c)}">${c>=0?'+':''}${c.toFixed(1)}%</span></div>
        ${hasPct?`<div class="strk"><div class="spin" style="left:calc(${s.pct}% - 1px)"></div></div>
        <div class="pct ${pc}">分位 ${s.pct}%</div>`:`<div class="strk" style="opacity:.15"></div>
        <div class="pct" style="color:var(--faint)">分位 —</div>`}
      </div>`;}).join('')}
    </div>
    <div class="fut-legend"><span>色块深浅 = 今日涨跌幅${total>40?` · ${total}个板块取TOP30`:''}</span><span>${hasPctAny?'轨道游标 = PE-TTM历史分位（左低估 · 右高位）':'PE分位为静态参考，见估值卡'}</span></div>
  </div>`;
}

const RENDER={
  fg_composite:rFGComposite,
  jqk_comps:rJqkComps,
  indices:rIndices,mainflow:rMainFlow,margin:rMargin,futures:rFutures,breadth:rBreadth,valuation:rValuation,sectors:rSectors,
  limitPool:rLimitPool,indVal:rIndVal,boards:rBoards,us_industries:rUsIndustries
};

function renderDash(){
  const c=$('#cards');let html='',buf=[];
  const flush=()=>{if(buf.length){html+=`<div class="grid-2">${buf.join('')}</div>`;buf.length=0;}};
  REG.forEach(r=>{if(!enabled(r.id))return;
    if(r.layout==='grid'){buf.push(RENDER[r.id]());}else{flush();html+=RENDER[r.id]();}
  });flush();
  c.innerHTML=html;
}

function renderSettings(){
  const s=$('#settings');s.innerHTML=CATS.map(cat=>{
    const items=REG.filter(r=>r.cat===cat.id);
    return `<div class="set-group">
      <div class="gh"><span>${cat.name}</span><span class="qa" data-qa="${cat.id}"></span></div>
      <div class="set-list">${items.map(r=>`
        <div class="set-item">
          <div class="l"><div class="n">${r.name}</div><div class="d">${r.desc}</div></div>
          <div class="sw ${enabled(r.id)?'on':''}" data-id="${r.id}"></div>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
  // group counts + totals
  CATS.forEach(cat=>{const on=REG.filter(r=>r.cat===cat.id&&enabled(r.id)).length;const t=REG.filter(r=>r.cat===cat.id).length;const el=document.querySelector(`[data-qa="${cat.id}"]`);if(el)el.textContent=`${on}/${t}`;});
  $('#cnt').textContent=REG.filter(r=>enabled(r.id)).length;
  $('#tot').textContent=REG.length;
}

/* sector sort toggle (delegation survives re-render) */
$('#cards').addEventListener('click',e=>{
  const b=e.target.closest('[data-sort]');if(!b)return;
  sectorSort=b.dataset.sort;renderDash();
});

/* toggle handler */
$('#settings').addEventListener('click',e=>{
  const sw=e.target.closest('.sw');if(!sw)return;
  const id=sw.dataset.id;state[id]=!enabled(id);save();
  sw.classList.toggle('on',enabled(id));
  renderDash();renderSettings();
});

/* tabs */
$('.tabbar').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x===b));
  $('#view-dash').hidden=b.dataset.tab!=='dash';
  $('#view-set').hidden=b.dataset.tab!=='set';
});

/* clock + date */
function tick(){const n=new Date();
  const w=['日','一','二','三','四','五','六'][n.getDay()];
  const hm=t=>`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  const rhythm=inSession(n)?'盘中 60s 轮询':'非交易时段 30min';
  $('#today').textContent=LIVE.ts
    ?`${n.getMonth()+1}月${n.getDate()}日 · 周${w} · 更新于 ${hm(LIVE.ts)} · ${rhythm}`
    :DATA_DATE;
}
tick();setInterval(tick,10000);

/* refresh: fetch live data from public APIs (runs entirely in the browser) */
$('#refresh').addEventListener('click',()=>loadLive(true));

/* init：先恢复上次成功拉到的数据（若有），再发起网络请求。
 * 这样首屏不会是空白/硬编码旧值，断网时也能看到「上次成功的数据 + 时间标签」。 */
loadCache();
renderDash();renderSettings();
loadJqk();
scheduleJqkDaily(); // 每天21:00浏览器侧定时刷新（纯前端，不依赖 WorkBuddy；未填远端地址则内部直接 return）
scheduleUsIndustries(); // 美股 GICS 前端实时聚合（加载即算 + 交易时段每6h刷新）
loadLive();

/* 数据更新策略：按是否开盘分两档 ——
 *   交易时段（周一至周五 9:30-11:30 / 13:00-15:00）：每 60 秒一轮，跟住盘中变化
 *   非交易时段（盘前/盘后/午休/周末）：降到 30 分钟一轮，避免无意义请求
 *   页面切到后台时不轮询；切回前台立即按当前档位判断是否补拉。手动点刷新始终可用。
 *   韭圈儿恐贪指数/6成分：独立调度，填了远端地址后每天 21:00 拉一次（scheduleJqkDaily），不随上面轮询。
 * 说明：只判断星期与时刻，不判断法定节假日 —— 节假日多发的几轮请求对接口无压力
 *（实测单次 12ms、连续 10 次无限流），换来的是不用维护节假日表。 */
const POLL_SESSION=60*1000, POLL_IDLE=30*60*1000, TICK_MS=15000;
function inSession(d){
  const w=d.getDay(); if(w===0||w===6)return false;
  const m=d.getHours()*60+d.getMinutes();
  return (m>=570&&m<690)||(m>=780&&m<900);
}
function tradingDay(d){const w=d.getDay();return w!==0&&w!==6;}
const staleMs=()=>inSession(new Date())?POLL_SESSION:POLL_IDLE;
setInterval(()=>{
  if(document.visibilityState!=='visible'||LIVE.busy)return;
  if(!LIVE.ts||Date.now()-LIVE.ts.getTime()>staleMs())loadLive();
},TICK_MS);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&(!LIVE.ts||Date.now()-LIVE.ts.getTime()>staleMs()))loadLive();
});

/* PWA */
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
